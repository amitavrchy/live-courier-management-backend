services:
  postgres:
    image: postgres:16-alpine
    container_name: andyesqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andyesqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andyesqo}
      POSTGRES_DB: ${POSTGRES_DB:-andyesqo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-andyesqo} -d ${POSTGRES_DB:-andyesqo}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - andyesqo

  redis:
    image: redis:7-alpine
    container_name: andyesqo-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - andyesqo

  app:
    image: ${APP_IMAGE:-andyesqo:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andyesqo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      RUN_DB_INIT: ${RUN_DB_INIT:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-http://localhost:3001/docs}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-andyesqo}:${POSTGRES_PASSWORD:-andyesqo}@postgres:5432/${POSTGRES_DB:-andyesqo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    networks:
      - andyesqo

volumes:
  postgres_data:
  redis_data:

networks:
  andyesqo:
    driver: bridge
