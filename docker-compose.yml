services:
  postgres:
    image: postgres:16-alpine
    container_name: andyesqo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andyesqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andyesqo}
      POSTGRES_DB: ${POSTGRES_DB:-andyesqo}
    ports:
      # Host access for local tools (optional). App talks over the compose network.
      # Host port defaults to 5433 to avoid clashing with a local Postgres on 5432.
      # App containers still reach Postgres at postgres:5432 on the compose network.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-andyesqo} -d ${POSTGRES_DB:-andyesqo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - andyesqo

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andyesqo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      RUN_DB_INIT: ${RUN_DB_INIT:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-andyesqo}:${POSTGRES_PASSWORD:-andyesqo}@postgres:5432/${POSTGRES_DB:-andyesqo}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - andyesqo

volumes:
  postgres_data:

networks:
  andyesqo:
    driver: bridge
