name: CI and Docker delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/courier_ci
      JWT_SECRET: ci-only-secret-never-use-in-production
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: courier_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d courier_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run test:e2e -- --runInBand
      - run: npm run build

  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: courier:ci
      JWT_SECRET: ci-only-secret-never-use-in-production
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: courier_ci
      PORT: 3001
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: courier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - name: Smoke test full stack and migrations
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://localhost:3001/v1/health
          docker compose exec -T app ./node_modules/.bin/prisma migrate status
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag courier:ci "$image:$COMMIT"
          docker tag courier:ci "$image:latest"
          docker push "$image:$COMMIT"
          docker push "$image:latest"
