services:
  postgres:
    image: postgres:16-alpine
    container_name: andyesqo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andyesqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andyesqo}
      POSTGRES_DB: ${POSTGRES_DB:-andyesqo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-andyesqo} -d ${POSTGRES_DB:-andyesqo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data_dev:
